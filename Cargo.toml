[package]
name = "animepahe"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls", "json"] }
regex = "1.11"
m3u8-rs = "6.0"
aes = "0.8"
cbc = "0.1"
url = "2.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
